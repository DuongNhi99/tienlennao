name: Deploy

# After CI passes on main: build both images, push them to GitHub Container Registry and roll
# them out to the server prepared by deploy/setup-server.sh. Inactive until the repository
# variable APP_DOMAIN and the secrets DEPLOY_HOST and DEPLOY_SSH_KEY are set.
# Rollback: run this workflow by hand with the commit SHA of an earlier release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Redeploy this earlier release (full commit SHA) without building
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SHA: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: >-
      vars.APP_DOMAIN != '' && !inputs.image_tag &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Image names
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-server:${{ env.SHA }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.APP_DOMAIN }}/api/v1
            BUILD_ID=${{ env.SHA }}
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ env.SHA }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    if: >-
      always() && vars.APP_DOMAIN != '' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.image_tag))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: deploy
      - name: Image names
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key with the optional DEPLOY_KNOWN_HOSTS secret; otherwise trust on first use.
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
      - name: Copy deployment files
        run: >-
          scp deploy/compose.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh
          "deploy@$DEPLOY_HOST:/opt/tienlen/"
      - name: Roll out
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The registry token goes over stdin so it never appears in a command line.
          printf '%s' "$GHCR_TOKEN" | ssh "deploy@$DEPLOY_HOST" "
            set -e
            cd /opt/tienlen
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            trap 'docker logout ghcr.io' EXIT
            IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$SHA' sh deploy.sh
          "
      - name: Check the public site
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${{ vars.APP_DOMAIN }}/api/v1/health/ready" && exit 0
            sleep 5
          done
          echo "https://${{ vars.APP_DOMAIN }} did not become ready" >&2
          exit 1

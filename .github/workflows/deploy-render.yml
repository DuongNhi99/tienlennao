name: Deploy API (Render)

# Free hosting (docs/FREE_HOSTING.md): after CI passes on main, ask Render to rebuild the API,
# so it never lags behind the web app, which Vercel deploys on its own. Inactive until the
# repository variable RENDER_DEPLOY_ENABLED is 'true' and the secret RENDER_DEPLOY_HOOK_URL
# (Render → tienlen-api → Settings → Deploy Hook) is set.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    if: >-
      vars.RENDER_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors -X POST "$HOOK" > /dev/null

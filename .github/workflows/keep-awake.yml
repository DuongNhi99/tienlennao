name: Keep awake

# Render's free plan stops the API after 15 idle minutes, and the next visitor then waits about
# a minute. Pinging it every 10 minutes keeps it running (744 of the 750 free hours a month),
# which also keeps the Supabase database active. Inactive until the repository variable
# KEEP_AWAKE_URL is set (docs/FREE_HOSTING.md).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.KEEP_AWAKE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        env:
          URL: ${{ vars.KEEP_AWAKE_URL }}
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "$URL"

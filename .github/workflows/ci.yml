name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tienlen
          POSTGRES_PASSWORD: tienlen_ci_password
          POSTGRES_DB: tienlen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tienlen -d tienlen"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://tienlen:tienlen_ci_password@localhost:5432/tienlen?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply migrations to a clean database
        run: pnpm --filter @tienlen/server exec prisma migrate deploy
      - name: Integration tests (API + PostgreSQL + Redis, database tienlen_test)
        run: pnpm test:integration
      - run: pnpm db:seed
      - run: pnpm build

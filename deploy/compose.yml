# Production stack for a single server: Caddy (HTTPS) → web + API, PostgreSQL, Redis and a
# daily backup job. Lives in /opt/tienlen on the server next to .env, Caddyfile, deploy.sh and
# backup.sh; the Deploy workflow copies these files and runs deploy.sh. See docs/DEPLOYMENT.md.
name: tienlen

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-server: &server
  image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-server:${IMAGE_TAG:?set IMAGE_TAG in .env}
  logging: *logging
  # Optional API settings (SMTP_URL, MAIL_FROM, INITIAL_COIN_BONUS, …) come from .env.
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://tienlen:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tienlen?schema=public
    REDIS_URL: redis://redis:6379
    WEB_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
    WEB_APP_URL: https://${APP_DOMAIN}
    API_PUBLIC_URL: https://${APP_DOMAIN}/api/v1
    TRUST_PROXY: '1'
    SOCKET_IO_REDIS_ADAPTER: 'true'
    UPLOAD_DIR: /data/uploads

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
      - web

  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    environment:
      API_INTERNAL_URL: http://server:4000/api/v1
    depends_on:
      server:
        condition: service_healthy

  server:
    <<: *server
    restart: unless-stopped
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off, run by deploy.sh before each release: migrations, then the (idempotent) seed.
  # Also used for admin commands: docker compose run --rm migrate node_modules/.bin/tsx …
  migrate:
    <<: *server
    profiles: [tools]
    command:
      [
        'sh',
        '-c',
        'node_modules/.bin/prisma migrate deploy && node_modules/.bin/tsx prisma/seed.ts',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: tienlen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tienlen
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tienlen -d tienlen']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Daily pg_dump into ./backups, kept for BACKUP_KEEP_DAYS days. Copy them off the server too.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: tienlen
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: tienlen
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ['sh', '/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  uploads:
